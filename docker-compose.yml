volumes:
  db_data:
  exports_data:
  # Redis keeps nothing on disk (see the redis service), but its image declares /data a volume: named, it is reused
  # when the container is recreated, instead of each recreation leaving another anonymous volume behind.
  redis_data:

# Docker's own log of each container (docker compose logs): at most 5 files of 10 MB, the oldest deleted. Without
# this the json-file logs grow without limit, the backend's access log fastest.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The services built from this repository (backend, worker, export_worker, ops and dashboard) run as an unprivileged
# user (the images set it; the backend's is BACKEND_UID below) with no Linux capabilities, and can't gain any
# (no-new-privileges: a setuid program in the image does nothing). None of them needs one: their ports are above 1024
# and they write only to their own folders and /tmp. The stock images (MySQL, WordPress, Redis) start as root to drop
# to their own user, which needs capabilities, so they keep Docker's defaults.
x-unprivileged: &unprivileged
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

networks:
  front:
  internal_api:
  # Only wordpress and ops (welldash²) join it, so welldash² can check WordPress without joining front, where MySQL is.
  # Its subnet is fixed so firewall rules can name it; it needs no access to the VM's PostgreSQL.
  wp_probe:
    ipam:
      config:
        - subnet: 10.20.2.0/24

# Every service logs with default-logging. Memory limits (mem_limit) leave room for each service's busiest normal
# load (normal use is 50 to 250 MB each, about 1 GB together; the backend and WordPress get more for bursts), so only
# a runaway process reaches them; then the kernel stops a process inside that container, not PostgreSQL or another
# service on the VM. Health checks show in `docker compose ps`.
#
# The stock images are pinned by digest as well as tag, so the image that runs is the one that was reviewed even if
# the tag is moved; Dependabot's docker-compose updates bump the digest (and the tag) in a pull request.
services:
  # --- WordPress + MySQL as you had ---
  db:
    image: mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    mem_limit: 1g
    logging: *default-logging
    networks:
      - front
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD}

  wordpress:
    # Only PHP and Apache come from this image. WordPress core and plugins live in ./home
    # (tracked in git) and are updated there, so bump this tag for PHP/Apache fixes.
    image: wordpress:7.1.4-php8.3-apache@sha256:8b64037bb2a3bdc41bebccb165f20ad5e4c786b684ae4a2bd5981f98aa1eb107
    depends_on:
      - db
    volumes:
      - ./home:/var/www/html
      - ./wordpress/php-hardening.ini:/usr/local/etc/php/conf.d/zz-hardening.ini:ro
      - ./wordpress/apache-hardening.conf:/etc/apache2/conf-enabled/zz-hardening.conf:ro
      # Browser caching and compression for the site (wordpress/zz-performance.conf explains each rule).
      - ./wordpress/zz-performance.conf:/etc/apache2/conf-enabled/zz-performance.conf:ro
    # On every address by default. WORDPRESS_BIND (and DASHBOARD_BIND below) publishes it on that one address
    # instead, e.g. the VM's address that haproxy connects to; then set DEPLOY_SITE_HOST to it for deploy.sh's
    # checks. Docker-published ports bypass the host's INPUT rules either way: docs/hosting.md has the DOCKER-USER
    # rules that let only haproxy reach 8080 and 8081.
    ports:
      - "${WORDPRESS_BIND:+${WORDPRESS_BIND}:}8080:80"
    restart: always
    # Apache (prefork) runs one process per request, each with mod_php and its own PHP memory (WordPress allows up
    # to 256 MB in the admin), so a burst of visitors adds up quickly (about 155 MB in normal use). 2 GB lets dozens
    # of requests run at once. The trade-off: a flood beyond that gets an Apache child killed (that request fails)
    # rather than taking memory from PostgreSQL and the rest of the VM.
    mem_limit: 2g
    logging: *default-logging
    networks:
      - front
      - wp_probe   # so welldash² can check it
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      DEPLOYMENT: ${DEPLOYMENT:-DEV}
      # Ensure site/home URLs point to the correct port to avoid redirects to :80
      WP_HOME: ${WP_HOME}
      WP_SITEURL: ${WP_SITEURL}
      # External dashboard base URL for theme template embedding
      DASHBOARD_URL: ${DASHBOARD_URL}

  # --- Flask backend (Gunicorn), no public port ---
  backend:
    build:
      context: ./dashboard/backend
      # dockerfile: Dockerfile   # optional if named "Dockerfile"
    <<: *unprivileged
    # The image's own user is 10001. Set BACKEND_UID and BACKEND_GID in .env to the VM user that owns the checkout
    # (`id -u`, `id -g`), so the logs and backups the worker writes into the checkout belong to that user
    # (docs/hosting.md, "Containers run unprivileged"). The same for worker, export_worker and ops.
    user: "${BACKEND_UID:-10001}:${BACKEND_GID:-10001}"
    env_file:
      - ./dashboard/backend/app/.env   # your existing backend .env (HOBOLINK, WQ, etc.)
    environment:
      # Override DB URL at runtime so you don't edit the backend .env for Docker
      DATABASE_URL: ${BACKEND_DATABASE_URL}
      # If you also want to drive the port via env:
      BACKEND_PORT: ${BACKEND_PORT}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      EXPORTS_DIR: ${EXPORTS_DIR:-/app/app/exports}
      # PostgreSQL cancels any API query that runs longer than this, and the API answers 504 (config.py).
      # API only: worker and export_worker don't set it, so ingestion, backfills and exports have no limit.
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-25000}
      # Short-lived cache of /api/series answers (utils/response_cache.py), in a Redis database of its own
      # (0 and 1 are the export queue's). Set to an empty value to turn it off.
      API_CACHE_REDIS_URL: ${API_CACHE_REDIS_URL-redis://redis:6379/2}
    expose:
      - "${BACKEND_PORT}"              # internal-only
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets container reach host/VM if needed
    restart: unless-stopped
    # About 200 MB idle. One /api/data answer near its 300,000-row cap briefly takes about 330 MB (rows, dicts and
    # a 52 MB JSON body), and 3 workers x 4 threads can run 12 at once. Measured peaks: 1.0 GB with 3 such requests
    # in parallel, 1.9 GB with 6, and up to 3 GB with all 12 (all answered; memory went back to ~300 MB after).
    mem_limit: 3g
    logging: *default-logging
    # gunicorn finishes the requests in progress within --graceful-timeout (30 s, Dockerfile) after SIGTERM
    stop_grace_period: 35s
    # /health answers without the database. The probe header keeps these checks out of the traffic counts
    # (utils/traffic.py).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "-o", "/dev/null", "-H", "X-Welldash2-Probe: 1",
             "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s
    networks:
      - internal_api
    volumes:
      - exports_data:/app/app/exports

  # Holds the export queue (databases 0 and 1, Celery) and the /api/series cache (database 2). Neither needs to
  # survive a restart, so nothing is saved to disk (--save ""; append-only is off by default): an export queued
  # when Redis restarts is failed by the hourly cleanup. Memory is capped at 256 MB; when it is full, Redis evicts
  # the least recently used keys that have an expiry (volatile-lru). Every cache entry has one
  # (utils/response_cache.py), Celery's queue keys never do, so the queue is never evicted to make room for the
  # cache. mem_limit leaves room above maxmemory for Redis's own overhead.
  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru", "--save", ""]
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    volumes:
      - redis_data:/data
    networks:
      - internal_api

  # --- Worker (same image), runs your Python script loop ---
  worker:
    build:
      context: ./dashboard/backend
    <<: *unprivileged
    user: "${BACKEND_UID:-10001}:${BACKEND_GID:-10001}"
    command: ["python","scripts/scheduler_temp.py"]     # correct path from /app/app working directory
    env_file:
      - ./dashboard/backend/app/.env
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL}
      # Set to 1 to mirror logs to Docker stdout in addition to files
      WORKER_LOG_TO_STDOUT: ${WORKER_LOG_TO_STDOUT}
      # Sentry tag for errors from this container, including scripts run here by hand (utils/sentry.py)
      SENTRY_COMPONENT: worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    # Scripts run here by hand (backfills, uploads) share this limit with the scheduled jobs
    mem_limit: 1536m
    logging: *default-logging
    # On SIGTERM the scheduler starts nothing new, gives running jobs 40 s to finish, then stops their subprocesses
    # (10 s) and exits (scripts/scheduler_temp.py shut_down); this is how long Docker waits before killing it.
    stop_grace_period: 60s
    # The scheduler loop touches this file every 30 s; older than 3 minutes means the loop has stopped.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/well-scheduler.alive') > 180)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    networks:
      - internal_api
    volumes:
      # Persist worker logs on host for easy access
      - ./dashboard/backend/app/logs:/app/app/logs
      # Nightly database dumps (scripts/backup_db.py), on the host in ./backups (gitignored; folders 0700 and files
      # 0600, owned by BACKEND_UID)
      - ./backups:/app/backups

  export_worker:
    build:
      context: ./dashboard/backend
    <<: *unprivileged
    user: "${BACKEND_UID:-10001}:${BACKEND_GID:-10001}"
    # -B runs the beat scheduler inside this (single) worker, for the hourly cleanup of expired exports; its
    # schedule file goes to /tmp, since the code folder isn't writable by the container's user.
    # Two exports at a time at most (the default is one per CPU), so large exports can't take the VM's memory.
    command: ["celery", "-A", "tasks.celery_app.celery_app", "worker", "-B", "--schedule-filename=/tmp/celerybeat-schedule",
              "--concurrency=2", "--loglevel=info"]
    env_file:
      - ./dashboard/backend/app/.env
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      EXPORTS_DIR: ${EXPORTS_DIR:-/app/app/exports}
      SENTRY_COMPONENT: export_worker   # Sentry tag for errors from this container (utils/sentry.py)
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    # Two exports at once, each process replaced once it holds over EXPORT_WORKER_MAX_MEMORY_KB (500 MB)
    mem_limit: 1536m
    logging: *default-logging
    # On SIGTERM Celery stops taking jobs and finishes the running ones; one still running after this is killed and
    # failed by the hourly cleanup (or when its page next asks for its status).
    stop_grace_period: 60s
    networks:
      - internal_api
    volumes:
      - exports_data:/app/app/exports

  # --- Next.js frontend ---
  dashboard:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
      args:
        # Build-time only (for next.config.js rewrites & public env)
        FLASK_API_URL: ${BACKEND_INTERNAL_URL}
        NEXT_PUBLIC_FLASK_API_URL: ${NEXT_PUBLIC_FLASK_API_URL}
    <<: *unprivileged   # runs as the image's nextjs user
    env_file:
      - ./dashboard/frontend/.env.local  # runtime server-side vars if you have any
    environment:
      # Runtime (Node/SSR or API routes) can also use these:
      FLASK_API_URL: ${BACKEND_INTERNAL_URL}
      NEXT_PUBLIC_FLASK_API_URL: ${NEXT_PUBLIC_FLASK_API_URL}
      # The reverse proxies whose X-Forwarded-For is believed (comma-separated addresses, as this container sees
      # them connect); see src/lib/clientIp.ts. 130.113.68.30 is haproxy.cas.mcmaster.ca, which welldash points at.
      # Unset means that default; set but empty (TRUSTED_PROXY_IPS=) means no proxy is trusted.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS-130.113.68.30}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${DASHBOARD_BIND:+${DASHBOARD_BIND}:}${DASHBOARD_PORT}:8081"   # DASHBOARD_BIND: as WORDPRESS_BIND above
    restart: always
    mem_limit: 512m
    logging: *default-logging
    # The page itself (static, no backend call). Next listens on the container's hostname (HOSTNAME is set by
    # Docker), so the check connects there rather than to localhost.
    healthcheck:
      test: ["CMD", "node", "-e",
             'fetch("http://" + require("os").hostname() + ":8081/")
              .then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s
    networks:
      - internal_api

  # --- welldash², the operations dashboard (dashboard/backend/app/ops/; README "welldash² (operations dashboard)") ---
  # Read-only pages of uptime, traffic, alerts and CI, behind one password. Only for McMaster's network/VPN: the
  # front proxy (haproxy.cas.mcmaster.ca) must never route to this port. It starts only when the "ops" profile is on
  # (COMPOSE_PROFILES=ops in .env), and refuses to start without OPS_PASSWORD_HASH and OPS_SECRET_KEY (also in .env).
  ops:
    profiles: ["ops"]
    build:
      context: ./dashboard/backend
    <<: *unprivileged
    user: "${BACKEND_UID:-10001}:${BACKEND_GID:-10001}"
    # One worker process: the failed-login limit and the uptime checks live in its memory. Threads serve pages.
    command: ["gunicorn", "-k", "gthread", "-w", "1", "--threads", "4", "--timeout", "60", "-b", "0.0.0.0:8090",
              "ops.app:create_app()"]
    environment:
      # A read-only role is better (README); unset, it reads with the backend's role.
      OPS_DATABASE_URL: ${OPS_DATABASE_URL:-${BACKEND_DATABASE_URL}}
      OPS_PASSWORD_HASH: ${OPS_PASSWORD_HASH:-}
      OPS_SECRET_KEY: ${OPS_SECRET_KEY:-}
      OPS_COOKIE_SECURE: ${OPS_COOKIE_SECURE:-0}
      OPS_LOGS_DIR: /ops/logs
      OPS_GITHUB_TOKEN: ${OPS_GITHUB_TOKEN:-}
      SENTRY_API_TOKEN: ${OPS_SENTRY_API_TOKEN:-}
      SENTRY_ORG: ${OPS_SENTRY_ORG:-}
      SENTRY_API_URL: ${OPS_SENTRY_API_URL:-https://sentry.io}
      HEALTHCHECKS_API_KEY: ${OPS_HEALTHCHECKS_API_KEY:-}
      OPS_GOATCOUNTER_CODE: ${OPS_GOATCOUNTER_CODE:-}
      OPS_GOATCOUNTER_TOKEN: ${OPS_GOATCOUNTER_TOKEN:-}
    ports:
      # Set OPS_BIND in .env (ops README): 127.0.0.1 for an SSH tunnel, or the VM's campus address. Docker's
      # published ports bypass the host firewall, so 0.0.0.0 would publish it on every address the VM has; unset, it
      # is published on the loopback only, never everywhere.
      - "${OPS_BIND:-127.0.0.1}:${OPS_PORT:-8090}:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # PostgreSQL runs on the VM itself
    depends_on:
      - dashboard
    restart: unless-stopped
    mem_limit: 384m
    logging: *default-logging
    # The login page, the one page that needs no session
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "-o", "/dev/null", "http://localhost:8090/login"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s
    networks:
      # internal_api carries the default route (gw_priority, Docker Engine 28+), so ops reaches PostgreSQL on the VM
      # (host.docker.internal) from internal_api's subnet whatever order Docker lists the networks in.
      internal_api:
        gw_priority: 1
      wp_probe: {}     # to check WordPress (not front, which WordPress shares with MySQL)
    volumes:
      # Log sizes on the System page, and deploy.log if deploy.sh writes it here (README). Read-only.
      - ./dashboard/backend/app/logs:/ops/logs:ro

  # Optional internal reverse proxy. If the McMaster VM already has an external
  # reverse proxy, you can comment out or remove this service. Keeping it here
  # for local development: visiting http://localhost will serve WordPress. For 
  # the VM requirement (direct 8080/8081), this container is NOT required.

