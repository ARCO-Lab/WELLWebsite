<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:,">
  <title>Sign in · welldash²</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='ops.css') }}">
</head>
<body class="login-page">
  <main class="login">
    <h1>welldash<sup>2</sup></h1>
    <p class="meta">WELL operations dashboard</p>
    {% if error %}<p class="notice bad" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
