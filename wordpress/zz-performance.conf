# Mounted into the WordPress container by docker-compose.yml, as conf-enabled/zz-performance.conf.
# Browser caching and compression for well.mcmaster.ca. Only uses modules the official wordpress
# image already enables (expires, deflate, filter), so it needs no image change.
#
# Without this, Apache sends no Cache-Control or Expires header at all: browsers guess how long to
# keep each file, and revalidate or re-download photos and stylesheets on later visits.

<IfModule mod_expires.c>
    ExpiresActive On

    # Photos, logos and icons. A replaced or re-encoded image is uploaded under a new file name,
    # so a month is safe; it also bounds how long a fixed-in-place file can stay stale.
    ExpiresByType image/jpeg    "access plus 30 days"
    ExpiresByType image/png     "access plus 30 days"
    ExpiresByType image/gif     "access plus 30 days"
    ExpiresByType image/webp    "access plus 30 days"
    ExpiresByType image/avif    "access plus 30 days"
    ExpiresByType image/svg+xml "access plus 30 days"
    ExpiresByType image/x-icon  "access plus 30 days"
    ExpiresByType image/vnd.microsoft.icon "access plus 30 days"

    # Fonts never change under the same name.
    ExpiresByType font/woff2 "access plus 1 year"
    ExpiresByType font/woff  "access plus 1 year"
    ExpiresByType font/ttf   "access plus 1 year"
    ExpiresByType application/font-woff  "access plus 1 year"
    ExpiresByType application/font-woff2 "access plus 1 year"

    # Stylesheets and scripts: WordPress links them as file.css?ver=..., and the theme sets ver to
    # the file's modification time, so an edited file gets a new URL. Those URLs are cached for a
    # year; a request without ?ver= (rare) gets one hour, so an edit still shows up quickly.
    ExpiresByType text/css               "access plus 1 hour"
    ExpiresByType text/javascript        "access plus 1 hour"
    ExpiresByType application/javascript "access plus 1 hour"
    <If "%{QUERY_STRING} =~ /(^|&)ver=/">
        ExpiresByType text/css               "access plus 1 year"
        ExpiresByType text/javascript        "access plus 1 year"
        ExpiresByType application/javascript "access plus 1 year"
    </If>

    # Pages, feeds and the REST API are generated per request (new posts, logged-in editors), so
    # their types are left out on purpose: they keep getting no expiry header, as before.
</IfModule>

# Debian's deflate.conf already compresses HTML, CSS, JavaScript and XML. Add the text formats it
# leaves out: SVG (the theme's logos are 30-105 KB of SVG paths and shrink about 3x), JSON (REST
# API, oEmbed), the web app manifest, and the uncompressed font formats.
<IfModule mod_deflate.c>
    <IfModule mod_filter.c>
        AddOutputFilterByType DEFLATE image/svg+xml application/json application/ld+json
        AddOutputFilterByType DEFLATE application/manifest+json image/x-icon image/vnd.microsoft.icon
        AddOutputFilterByType DEFLATE font/ttf font/otf application/vnd.ms-fontobject
    </IfModule>
</IfModule>

# A missing image, stylesheet, script or font under wp-content/ gets Apache's own short 404.
# Otherwise the site's .htaccess sends every missing file to WordPress, which builds a full
# "page not found" page (about 50 KB and 1-4 s of PHP) that nobody sees: browsers asking for an
# old icon or font, and bots probing for files.
<Directory "/var/www/html/wp-content">
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule \.(?:css|js|map|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot)$ - [R=404,L]
        # Everything else continues with the rules from .htaccess, as before.
        RewriteOptions Inherit
    </IfModule>
</Directory>
