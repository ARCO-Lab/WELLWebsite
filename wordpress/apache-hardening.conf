# Mounted into the WordPress container by docker-compose.yml. Loaded after Debian's
# conf-enabled/security.conf, so these values win: send "Server: Apache" without the
# version or OS, and leave the version line off error pages.
ServerTokens Prod
ServerSignature Off

# XML-RPC: password guessing through it gets around any login-page protection, and pingbacks make the server fetch
# other sites' URLs. The site's own pages don't use it, but Jetpack's connection to WordPress.com may: if
# wp-admin > Jetpack shows the connection broken, delete this block and recreate the container. (Apache sees
# haproxy's address rather than the client's, so allowing only Jetpack's servers isn't possible here.)
<Files "xmlrpc.php">
    Require all denied
</Files>

# WordPress's readme and licence name its version; the sample config has no use on a live site.
<FilesMatch "^(readme\.html|license\.txt|wp-config-sample\.php)$">
    Require all denied
</FilesMatch>

# Uploads are media only: never run a PHP file that ends up there. The image allows .htaccess files everywhere, and
# one uploaded here could otherwise allow PHP again (its sections merge after <Directory> ones). So .htaccess files
# are ignored under uploads (nothing there uses one), and <LocationMatch>, which Apache applies after every directory,
# file and .htaccess section, refuses PHP by URL, also with extra path after the name (shell.php/x.jpg).
<Directory "/var/www/html/wp-content/uploads">
    AllowOverride None
    <FilesMatch "\.(?i:php\d*|phtml|phar|pht)$">
        Require all denied
    </FilesMatch>
</Directory>
<LocationMatch "(?i)^/wp-content/uploads/.*\.(php\d*|phtml|phar|pht)(/|$)">
    Require all denied
</LocationMatch>
