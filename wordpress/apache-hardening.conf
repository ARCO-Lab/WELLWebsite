# Mounted into the WordPress container by docker-compose.yml. Loaded after Debian's
# conf-enabled/security.conf, so these values win: send "Server: Apache" without the
# version or OS, and leave the version line off error pages.
ServerTokens Prod
ServerSignature Off

# XML-RPC: password guessing through it gets around any login-page protection, and pingbacks make the server fetch
# other sites' URLs. Nothing on the site uses it. (Jetpack's connection can; Apache sees haproxy's address rather
# than the client's, so allowing only Jetpack's servers isn't possible here.)
<Files "xmlrpc.php">
    Require all denied
</Files>

# WordPress's readme and licence name its version; the sample config has no use on a live site.
<FilesMatch "^(readme\.html|license\.txt|wp-config-sample\.php)$">
    Require all denied
</FilesMatch>

# Uploads are media only: never run a PHP file that ends up there. A <Files> section inside <Directory> is applied
# after any .htaccess, so an uploaded .htaccess can't allow it again.
<Directory "/var/www/html/wp-content/uploads">
    <FilesMatch "\.(?i:php\d*|phtml|phar|pht)$">
        Require all denied
    </FilesMatch>
</Directory>
