# Mounted into the WordPress container by docker-compose.yml. Loaded after Debian's
# conf-enabled/security.conf, so these values win: send "Server: Apache" without the
# version or OS, and leave the version line off error pages.
ServerTokens Prod
ServerSignature Off

# XML-RPC: password guessing through it gets around the proxy's /wp-admin/ restriction (one system.multicall request
# can try hundreds of passwords), and pingbacks make the server fetch other sites' URLs. Nothing on the site uses
# it: the theme doesn't, and Jetpack isn't connected to WordPress.com. If Jetpack is ever connected and reports a
# connection problem, this block is the one to remove (Apache sees haproxy's address rather than the client's, so
# allowing only Jetpack's servers isn't possible here).
<Files "xmlrpc.php">
    Require all denied
</Files>

# Comments and pingbacks are off (mu-plugins/well-hardening.php); refuse the scripts that accept them outright, so
# bots posting directly can't fill the moderation queue, the database and its backups.
<FilesMatch "^(wp-comments-post|wp-trackback)\.php$">
    Require all denied
</FilesMatch>

# WordPress's readme and licence name its version; the sample config has no use on a live site (requesting it runs
# WordPress with the sample database settings, a 500 "Database Error").
<FilesMatch "^(readme\.html|license\.txt|wp-config-sample\.php)$">
    Require all denied
</FilesMatch>
# Plugins' and themes' readmes, changelogs and package files name their versions (and the theme's README is the
# editors' how-to, not for visitors).
<LocationMatch "(?i)^/wp-content/.*/((readme|changelog|changes|history)(\.(txt|md|html))?|composer\.(json|lock)|package(-lock)?\.json)$">
    Require all denied
</LocationMatch>

# Uploads are media only: never run a PHP file that ends up there. The image allows .htaccess files everywhere, and
# one uploaded here could otherwise allow PHP again (its sections merge after <Directory> ones). So .htaccess files
# are ignored under uploads (nothing there uses one), and <LocationMatch>, which Apache applies after every directory,
# file and .htaccess section, refuses PHP by URL, also with extra path after the name (shell.php/x.jpg).
<Directory "/var/www/html/wp-content/uploads">
    AllowOverride None
    <FilesMatch "\.(?i:php\d*|phtml|phar|pht)$">
        Require all denied
    </FilesMatch>
</Directory>
<LocationMatch "(?i)^/wp-content/uploads/.*\.(php\d*|phtml|phar|pht)(/|$)">
    Require all denied
</LocationMatch>

# Security headers. The stock image doesn't enable mod_headers, so load it here (the guard skips it if it already is).
<IfModule !headers_module>
    LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
</IfModule>
# HSTS: browsers that have seen the site over HTTPS go straight to HTTPS next time, so a first request over plain
# http:// on hostile Wi-Fi can't be intercepted before the proxy's redirect. TLS ends at the campus proxy, and
# browsers ignore this header on plain-HTTP answers, so sending it from here is safe. It starts at one day so a
# mistake can't strand visitors for long; once the site has been fine over HTTPS for a few weeks, raise it to
# max-age=31536000 (a year). No includeSubDomains: other mcmaster.ca hosts aren't ours to decide.
Header always set Strict-Transport-Security "max-age=86400"
# "set" (not "always") for these, so they replace what WordPress itself sends on its pages (wp-login.php sends
# X-Frame-Options, the REST API sends nosniff) instead of adding a second copy.
Header set X-Content-Type-Options "nosniff"
Header set Referrer-Policy "strict-origin-when-cross-origin"
# The site may frame itself (the block editor's previews), nothing else may frame it.
Header set X-Frame-Options "SAMEORIGIN"
# Content-Security-Policy in report-only mode: browsers enforce nothing yet, but log in the developer console every
# resource the policy would have blocked. Open the site's pages with the console open; when nothing the site needs is
# reported, rename the header to Content-Security-Policy to enforce it. The hosts are what the theme loads: Flickity
# from cdnjs, Google Fonts, GoatCounter, McMaster's header/footer menu and Google search (js/hfcopy.js), YouTube
# (js/video_slider.js) and the dashboard's iframe (page-dashboard.php). 'unsafe-inline' is there because the theme and
# WordPress print inline scripts and styles.
Header set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://gc.zgo.at https://cse.google.com https://www.google.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://www.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://well.goatcounter.com https://documents.mcmaster.ca https://cse.google.com https://www.google.com; frame-src https://welldash.mcmaster.ca https://www.youtube.com https://www.youtube-nocookie.com https://cse.google.com https://www.google.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://www.google.ca https://www.google.com"
