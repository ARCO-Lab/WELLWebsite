# Mounted by docker-compose.yml over the wordpress image's own remoteip.conf, which makes Apache take the client's
# address from X-Forwarded-For whenever a request comes from a private or loopback address (10/8, 172.16/12,
# 192.168/16, 169.254/16, 127/8). Any container or local process could then claim to be anyone. With this file
# empty of directives, mod_remoteip stays loaded but does nothing: Apache's logs and REMOTE_ADDR show the connection's
# own address, which for visitors is the campus proxy's (130.113.68.30). The failed-login limit reads the forwarded
# address itself, and only from the proxies in WELL_TRUSTED_PROXY_IPS (home/wp-content/mu-plugins/well-hardening.php).
